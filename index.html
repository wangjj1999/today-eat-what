<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>今天吃什么</title>
  <style>
/* ===== Reset & Base ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans SC", sans-serif;
  background: #f9fafb;
  color: #1f2937;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ===== Header ===== */
.header {
  background: linear-gradient(135deg, #f97316, #ef4444);
  color: #fff;
  text-align: center;
  padding: 20px 16px 18px;
  box-shadow: 0 2px 8px rgba(239, 68, 68, 0.25);
}
.header-title { font-size: 22px; font-weight: 800; }
.header-subtitle { font-size: 12px; opacity: 0.8; margin-top: 2px; }

/* ===== Settings Button ===== */
.header-actions { position: absolute; top: 12px; right: 16px; }
.btn-settings {
  background: rgba(255,255,255,0.2);
  color: #fff;
  border: none;
  font-size: 20px;
  width: 36px; height: 36px;
  border-radius: 50%;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s;
  -webkit-tap-highlight-color: transparent;
}
.btn-settings:hover { background: rgba(255,255,255,0.35); }

/* ===== Sync Status ===== */
.sync-dot {
  display: inline-block;
  width: 8px; height: 8px;
  border-radius: 50%;
  margin-right: 6px;
  vertical-align: middle;
}
.sync-dot.on { background: #10b981; }
.sync-dot.off { background: #9ca3af; }
.sync-dot.loading { background: #f59e0b; animation: pulse 1s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
.sync-info { font-size: 12px; color: #6b7280; text-align: center; margin-top: 4px; }

/* ===== Settings Modal ===== */
.settings-section { margin-bottom: 4px; }
.settings-label { font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px; display: block; }
.settings-hint { font-size: 12px; color: #9ca3af; margin-top: 4px; line-height: 1.5; }
.settings-hint a { color: #8b5cf6; }
.btn-small {
  background: #f3f4f6; color: #4b5563;
  border: none; padding: 6px 14px;
  border-radius: 8px; font-size: 13px; font-weight: 600;
  cursor: pointer;
}
.btn-small:hover { background: #e5e7eb; }
.btn-small.danger { background: #fef2f2; color: #ef4444; }
.btn-small.danger:hover { background: #fecaca; }

/* ===== Main Container ===== */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 20px;
  padding: 20px 16px 32px;
  max-width: 900px;
  width: 100%;
  margin: 0 auto;
}

/* ===== Section Header (per menu panel) ===== */
.section-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 4px;
}
.section-header .section-icon { font-size: 22px; }
.section-header .section-title { font-size: 17px; font-weight: 800; }

/* ===== Lottery Section ===== */
.lottery-section {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
}

.lottery-box {
  width: 100%;
  max-width: 420px;
  background: #fef3c7;
  border: 2px dashed #f59e0b;
  border-radius: 16px;
  padding: 28px 16px;
  text-align: center;
  min-height: 100px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: border-color 0.3s, background 0.3s;
}
.lottery-box.rolling {
  border-color: #f97316;
  background: #fff7ed;
}
.lottery-box.result {
  border-style: solid;
  border-color: #10b981;
  background: #ecfdf5;
}

/* Premium (改善伙食) lottery box overrides */
.lottery-box.premium {
  border-color: #a78bfa;
  background: #f5f3ff;
}
.lottery-box.premium.rolling {
  border-color: #8b5cf6;
  background: #ede9fe;
}
.lottery-box.premium.result {
  border-color: #10b981;
  background: #ecfdf5;
}

.lottery-label {
  font-size: 13px;
  color: #92400e;
}
.lottery-result {
  font-size: 28px;
  font-weight: 800;
  color: #d97706;
  min-height: 40px;
  line-height: 40px;
  word-break: break-all;
}
.lottery-result.bounce {
  animation: resultBounce 0.5s ease;
}

@keyframes resultBounce {
  0%   { transform: scale(1); }
  30%  { transform: scale(1.25); }
  60%  { transform: scale(0.95); }
  100% { transform: scale(1); }
}

.btn-lottery {
  background: linear-gradient(135deg, #f97316, #ef4444);
  color: #fff;
  border: none;
  padding: 14px 56px;
  font-size: 18px;
  font-weight: 700;
  border-radius: 50px;
  cursor: pointer;
  box-shadow: 0 4px 14px rgba(239, 68, 68, 0.35);
  transition: transform 0.15s, box-shadow 0.15s, opacity 0.2s;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
.btn-lottery:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(239, 68, 68, 0.4); }
.btn-lottery:active:not(:disabled) { transform: translateY(0); }
.btn-lottery:disabled { opacity: 0.5; cursor: not-allowed; }

/* ===== Menu Panel ===== */
.menu-panel {
  display: flex;
  flex-direction: column;
  gap: 16px;
  flex: 1;
  min-width: 0;
}

.btn-lottery.premium {
  background: linear-gradient(135deg, #f59e0b, #8b5cf6);
  box-shadow: 0 4px 14px rgba(139, 92, 246, 0.35);
}
.btn-lottery.premium:hover:not(:disabled) {
  box-shadow: 0 6px 20px rgba(139, 92, 246, 0.4);
}

/* ===== Food List Section ===== */
.list-section { flex: 1; }

.list-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}
.list-title { font-size: 15px; font-weight: 700; }

.btn-add {
  background: #10b981;
  color: #fff;
  border: none;
  padding: 6px 16px;
  font-size: 13px;
  font-weight: 600;
  border-radius: 20px;
  cursor: pointer;
  transition: background 0.15s;
  -webkit-tap-highlight-color: transparent;
}
.btn-add:hover { background: #059669; }

.btn-add.premium { background: #8b5cf6; }
.btn-add.premium:hover { background: #7c3aed; }

.food-list {
  list-style: none;
  border: 1px solid #e5e7eb;
  border-radius: 10px;
  overflow: hidden;
  background: #fff;
  max-height: 360px;
  overflow-y: auto;
}

.food-list li {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 14px;
  border-bottom: 1px solid #f3f4f6;
  transition: background 0.15s;
}
.food-list li:last-child { border-bottom: none; }
.food-list li:hover { background: #f9fafb; }

.food-name {
  font-size: 15px;
  font-weight: 500;
  word-break: break-all;
}

.food-actions {
  display: flex;
  gap: 8px;
  flex-shrink: 0;
  margin-left: 8px;
}

.btn-icon {
  background: none;
  border: 1px solid #e5e7eb;
  border-radius: 6px;
  padding: 4px 8px;
  font-size: 14px;
  cursor: pointer;
  transition: background 0.15s;
  -webkit-tap-highlight-color: transparent;
  line-height: 1;
}
.btn-icon:hover { background: #f3f4f6; }
.btn-icon.danger:hover { background: #fef2f2; border-color: #fecaca; }

.empty-hint {
  text-align: center;
  color: #9ca3af;
  font-size: 14px;
  padding: 32px 0;
}
.empty-hint.hidden { display: none; }

/* ===== Modal ===== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.45);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  padding: 20px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s;
}
.modal-overlay.active {
  opacity: 1;
  pointer-events: auto;
}

.modal {
  background: #fff;
  border-radius: 14px;
  padding: 24px 20px;
  width: 100%;
  max-width: 360px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.modal-sm { max-width: 320px; }

.modal-title { font-size: 17px; font-weight: 700; text-align: center; }
.modal-body { font-size: 14px; color: #6b7280; text-align: center; }

.modal-input {
  width: 100%;
  padding: 12px 14px;
  border: 2px solid #e5e7eb;
  border-radius: 10px;
  font-size: 16px;
  outline: none;
  transition: border-color 0.15s;
}
.modal-input:focus { border-color: #f97316; }

.modal-error {
  color: #ef4444;
  font-size: 12px;
  min-height: 16px;
  text-align: center;
}

.modal-actions {
  display: flex;
  gap: 10px;
  justify-content: center;
}

.btn-cancel, .btn-confirm {
  padding: 10px 28px;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  border: none;
  transition: background 0.15s;
}
.btn-cancel { background: #f3f4f6; color: #4b5563; }
.btn-cancel:hover { background: #e5e7eb; }
.btn-confirm { background: #f97316; color: #fff; }
.btn-confirm:hover { background: #ea580c; }
.btn-confirm:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-danger { background: #ef4444; }
.btn-danger:hover { background: #dc2626; }

/* ===== Toast ===== */
.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  background: #1f2937;
  color: #fff;
  padding: 10px 22px;
  border-radius: 24px;
  font-size: 14px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s;
  z-index: 200;
  white-space: nowrap;
}
.toast.show { opacity: 1; }

/* ===== Emoji Confetti ===== */
.confetti {
  position: fixed;
  font-size: 24px;
  pointer-events: none;
  z-index: 150;
  animation: confettiFall 1.2s ease-out forwards;
}
@keyframes confettiFall {
  0%   { opacity: 1; transform: translateY(0) rotate(0deg) scale(1); }
  100% { opacity: 0; transform: translateY(-120px) rotate(360deg) scale(0.3); }
}

/* ===== PC Responsive: ≥768px ===== */
@media (min-width: 768px) {
  .main {
    flex-direction: row;
    align-items: flex-start;
    gap: 32px;
    padding: 32px 24px;
  }
  .header { padding: 24px 16px 20px; }
  .header-title { font-size: 26px; }
  .lottery-box { padding: 32px 20px; min-height: 120px; }
  .lottery-result { font-size: 28px; line-height: 40px; }
  .food-list { max-height: 300px; }
}
  </style>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <h1 class="header-title">🍜 今天吃什么</h1>
    <p class="header-subtitle">选择困难症终结者</p>
    <div class="header-actions">
      <button class="btn-settings" id="btnSettings" title="设置">⚙️</button>
    </div>
  </header>

  <main class="main">
    <!-- 日常餐谱 -->
    <div class="menu-panel" data-menu="daily">
      <div class="section-header">
        <span class="section-icon">🍚</span>
        <span class="section-title">日常</span>
      </div>
      <section class="lottery-section">
        <div class="lottery-box" id="lotteryBoxDaily">
          <span class="lottery-label">🎰 点击下方按钮开始抽奖</span>
          <span class="lottery-result" id="lotteryResultDaily"></span>
        </div>
        <button class="btn-lottery" id="btnLotteryDaily" disabled>🎲 开抽！</button>
      </section>
      <section class="list-section">
        <div class="list-header">
          <span class="list-title">📋 可吃清单 (<span id="countDisplayDaily">0</span>)</span>
          <button class="btn-add" id="btnAddDaily">+ 添加</button>
        </div>
        <ul class="food-list" id="foodListDaily"></ul>
        <p class="empty-hint" id="emptyHintDaily">还没有添加吃的，先加点吧~</p>
      </section>
    </div>

    <!-- 改善伙食餐谱 -->
    <div class="menu-panel" data-menu="premium">
      <div class="section-header">
        <span class="section-icon">🥘</span>
        <span class="section-title">改善伙食</span>
      </div>
      <section class="lottery-section">
        <div class="lottery-box premium" id="lotteryBoxPremium">
          <span class="lottery-label">🎰 点击下方按钮开始抽奖</span>
          <span class="lottery-result" id="lotteryResultPremium"></span>
        </div>
        <button class="btn-lottery premium" id="btnLotteryPremium" disabled>🎲 开抽！</button>
      </section>
      <section class="list-section">
        <div class="list-header">
          <span class="list-title">📋 可吃清单 (<span id="countDisplayPremium">0</span>)</span>
          <button class="btn-add premium" id="btnAddPremium">+ 添加</button>
        </div>
        <ul class="food-list" id="foodListPremium"></ul>
        <p class="empty-hint" id="emptyHintPremium">还没有添加吃的，先加点吧~</p>
      </section>
    </div>
  </main>

  <!-- Modal Overlay -->
  <div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal" id="modal">
      <h3 class="modal-title" id="modalTitle">添加食物</h3>
      <input
        type="text"
        class="modal-input"
        id="modalInput"
        placeholder="输入食物名称..."
        maxlength="30"
        autocomplete="off"
        aria-label="食物名称"
      />
      <p class="modal-error" id="modalError"></p>
      <div class="modal-actions">
        <button class="btn-cancel" id="btnCancel">取消</button>
        <button class="btn-confirm" id="btnConfirm">确认</button>
      </div>
    </div>
  </div>

  <!-- Delete Confirm Modal -->
  <div class="modal-overlay" id="deleteOverlay" role="dialog" aria-modal="true" aria-labelledby="deleteModalTitle">
    <div class="modal modal-sm" id="deleteModal">
      <h3 class="modal-title" id="deleteModalTitle">确认删除</h3>
      <p class="modal-body" id="deleteMsg">确定删除「XXX」？</p>
      <div class="modal-actions">
        <button class="btn-cancel" id="btnDeleteCancel">取消</button>
        <button class="btn-confirm btn-danger" id="btnDeleteConfirm">删除</button>
      </div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div class="modal-overlay" id="settingsOverlay" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div class="modal" id="settingsModal">
      <h3 class="modal-title" id="settingsTitle">⚙️ 同步设置</h3>
      <div class="settings-section">
        <span id="syncStatus">
          <span class="sync-dot off"></span>未启用同步
        </span>
      </div>
      <div class="settings-section">
        <label class="settings-label" for="settingsToken">GitHub Token</label>
        <input type="password" class="modal-input" id="settingsToken"
               placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" maxlength="100" autocomplete="off"/>
        <p class="settings-hint">
          需要创建一个 Fine-grained token，仅授权此仓库的 Contents 读写。
          <a href="https://github.com/settings/tokens?type=beta" target="_blank">创建 Token →</a>
        </p>
      </div>
      <p class="modal-error" id="settingsError"></p>
      <div class="modal-actions">
        <button class="btn-small danger" id="btnClearToken" style="display:none">清除 Token</button>
        <button class="btn-cancel" id="btnSettingsCancel">关闭</button>
        <button class="btn-confirm" id="btnSettingsSave">保存并启用</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script>
    // ===== Data Layer =====
    const STORAGE_KEY_DAILY = 'food-list-daily';
    const STORAGE_KEY_PREMIUM = 'food-list-premium';
    const LEGACY_KEY = 'food-list';
    const TOKEN_KEY = 'gh-sync-token';
    const REPO_OWNER = 'wangjj1999';
    const REPO_NAME = 'today-eat-what';
    const DATA_PATH = 'data.json';
    const REPO_API = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${DATA_PATH}`;

    // Token management
    function getToken() { return localStorage.getItem(TOKEN_KEY) || ''; }
    function setToken(t) { if (t) localStorage.setItem(TOKEN_KEY, t); }
    function clearToken() { localStorage.removeItem(TOKEN_KEY); }

    // Remote sync state
    let remoteSha = null;
    let syncEnabled = false;

    async function fetchRemoteData() {
      const token = getToken();
      if (!token) return null;
      try {
        const resp = await fetch(REPO_API, {
          headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github.v3+json' },
          cache: 'no-store'
        });
        if (!resp.ok) {
          if (resp.status === 404) return null; // data.json doesn't exist yet
          throw new Error(`GitHub API: ${resp.status}`);
        }
        const data = await resp.json();
        remoteSha = data.sha;
        const decoded = JSON.parse(atob(data.content));
        if (decoded && Array.isArray(decoded.daily) && Array.isArray(decoded.premium)) {
          return { daily: decoded.daily, premium: decoded.premium };
        }
      } catch (e) { console.warn('fetchRemoteData failed:', e.message); }
      return null;
    }

    async function pushRemoteData() {
      const token = getToken();
      if (!token || !syncEnabled) return;
      try {
        const json = JSON.stringify(foods);
        // Use TextEncoder for proper UTF-8 base64 encoding
        const bytes = new TextEncoder().encode(json);
        const base64 = btoa(String.fromCharCode(...bytes));
        const body = { message: 'update food lists', content: base64 };
        if (remoteSha) body.sha = remoteSha;

        const resp = await fetch(REPO_API, {
          method: 'PUT',
          headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github.v3+json' },
          body: JSON.stringify(body)
        });
        if (resp.ok) {
          const data = await resp.json();
          remoteSha = data.content.sha;
          return true;
        } else if (resp.status === 422) {
          // SHA conflict — data changed remotely, will be picked up on next load
          console.warn('pushRemoteData: SHA conflict, remote changed');
          remoteSha = null;
        }
      } catch (e) { console.warn('pushRemoteData failed:', e.message); }
      return false;
    }

    // Local fallback
    function loadFoods(key, defaults) {
      try {
        const raw = localStorage.getItem(key);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed)) return parsed.filter(f => typeof f === 'string' && f.trim());
        }
      } catch (e) { /* localStorage corrupt or unavailable */ }
      return [...defaults];
    }

    function saveFoods(key, foodsArr) {
      try {
        localStorage.setItem(key, JSON.stringify(foodsArr));
      } catch (e) {
        showToast('存储空间不足，请清理一些数据');
      }
    }

    // Migrate legacy data on first load
    (function migrateLegacy() {
      try {
        const legacy = localStorage.getItem(LEGACY_KEY);
        if (legacy) {
          const parsed = JSON.parse(legacy);
          if (Array.isArray(parsed) && parsed.length > 0) {
            if (!localStorage.getItem(STORAGE_KEY_DAILY)) {
              localStorage.setItem(STORAGE_KEY_DAILY, JSON.stringify(parsed));
            }
          }
          localStorage.removeItem(LEGACY_KEY);
        }
      } catch (e) { /* ignore */ }
    })();

    // In-memory state
    const DEFAULT_DAILY = ['兰州拉面', '黄焖鸡米饭', '沙县小吃', '麦当劳', '麻辣烫'];
    const DEFAULT_PREMIUM = [];

    let foods = {
      daily: loadFoods(STORAGE_KEY_DAILY, DEFAULT_DAILY),
      premium: loadFoods(STORAGE_KEY_PREMIUM, DEFAULT_PREMIUM),
    };

    function persistMenu(menuKey) {
      const key = menuKey === 'daily' ? STORAGE_KEY_DAILY : STORAGE_KEY_PREMIUM;
      saveFoods(key, foods[menuKey]);
      // Async push to GitHub (fire and forget)
      pushRemoteData();
    }

    // ===== Sync on Load =====
    (async function initSync() {
      const token = getToken();
      if (!token) return;

      syncEnabled = true;
      updateSyncUI('loading');

      const remoteData = await fetchRemoteData();
      if (remoteData) {
        // Remote data wins — update in-memory and localStorage
        foods.daily = remoteData.daily;
        foods.premium = remoteData.premium;
        saveFoods(STORAGE_KEY_DAILY, foods.daily);
        saveFoods(STORAGE_KEY_PREMIUM, foods.premium);
        updateSyncUI('on');
      } else if (remoteSha === null && remoteData === null) {
        // Remote fetch failed (network or 404) — keep local, but sync is still on
        updateSyncUI('on');
      } else {
        updateSyncUI('off');
      }

      // Re-render both menus with synced data
      renderList('daily');
      renderList('premium');
    })();
    // ===== DOM References =====
    // Daily
    const lotteryBoxDaily    = document.getElementById('lotteryBoxDaily');
    const lotteryResultDaily = document.getElementById('lotteryResultDaily');
    const btnLotteryDaily    = document.getElementById('btnLotteryDaily');
    const foodListDaily      = document.getElementById('foodListDaily');
    const countDisplayDaily  = document.getElementById('countDisplayDaily');
    const emptyHintDaily     = document.getElementById('emptyHintDaily');
    const btnAddDaily        = document.getElementById('btnAddDaily');

    // Premium
    const lotteryBoxPremium    = document.getElementById('lotteryBoxPremium');
    const lotteryResultPremium = document.getElementById('lotteryResultPremium');
    const btnLotteryPremium    = document.getElementById('btnLotteryPremium');
    const foodListPremium      = document.getElementById('foodListPremium');
    const countDisplayPremium  = document.getElementById('countDisplayPremium');
    const emptyHintPremium     = document.getElementById('emptyHintPremium');
    const btnAddPremium        = document.getElementById('btnAddPremium');

    // DOM ref lookup helpers
    const domRefs = {
      daily: {
        lotteryBox: lotteryBoxDaily, lotteryResult: lotteryResultDaily,
        btnLottery: btnLotteryDaily, foodList: foodListDaily,
        countDisplay: countDisplayDaily, emptyHint: emptyHintDaily,
        btnAdd: btnAddDaily,
      },
      premium: {
        lotteryBox: lotteryBoxPremium, lotteryResult: lotteryResultPremium,
        btnLottery: btnLotteryPremium, foodList: foodListPremium,
        countDisplay: countDisplayPremium, emptyHint: emptyHintPremium,
        btnAdd: btnAddPremium,
      },
    };

    // Modal — add/edit
    const modalOverlay = document.getElementById('modalOverlay');
    const modalTitle   = document.getElementById('modalTitle');
    const modalInput   = document.getElementById('modalInput');
    const modalError   = document.getElementById('modalError');
    const btnCancel    = document.getElementById('btnCancel');
    const btnConfirm   = document.getElementById('btnConfirm');

    // Modal — delete
    const deleteOverlay    = document.getElementById('deleteOverlay');
    const deleteMsg        = document.getElementById('deleteMsg');
    const btnDeleteCancel  = document.getElementById('btnDeleteCancel');
    const btnDeleteConfirm = document.getElementById('btnDeleteConfirm');

    // Toast
    const toast = document.getElementById('toast');

    // ===== State =====
    let editIndex = -1;
    let deleteIndex = -1;
    let currentMenu = 'daily'; // which menu the modal is operating on
    let isRollingDaily = false;
    let isRollingPremium = false;

    // ===== Render =====
    function renderList(menuKey) {
      const refs = domRefs[menuKey];
      const list = foods[menuKey];
      const count = list.length;

      refs.countDisplay.textContent = count;

      if (count === 0) {
        refs.emptyHint.classList.remove('hidden');
        refs.foodList.innerHTML = '';
        refs.btnLottery.disabled = true;
        refs.btnLottery.textContent = '🎲 开抽！';
        refs.lotteryResult.textContent = '';
        refs.lotteryResult.classList.remove('bounce');
        refs.lotteryBox.classList.remove('result');
        return;
      }

      refs.emptyHint.classList.add('hidden');
      refs.btnLottery.disabled = false;
      refs.btnLottery.textContent = '🎲 开抽！';
      refs.lotteryResult.textContent = '';
      refs.lotteryResult.classList.remove('bounce');
      refs.lotteryBox.classList.remove('result');

      refs.foodList.innerHTML = list.map((name, i) => `
        <li>
          <span class="food-name">${escapeHtml(name)}</span>
          <span class="food-actions">
            <button class="btn-icon" data-menu="${menuKey}" data-edit="${i}" title="编辑">✏️</button>
            <button class="btn-icon danger" data-menu="${menuKey}" data-delete="${i}" title="删除">🗑️</button>
          </span>
        </li>
      `).join('');
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // ===== Initial render =====
    renderList('daily');
    renderList('premium');

    // ===== Modal: Add / Edit =====
    function openAddModal(menuKey) {
      currentMenu = menuKey;
      editIndex = -1;
      const label = menuKey === 'daily' ? '日常' : '改善伙食';
      modalTitle.textContent = `添加食物 — ${label}`;
      modalInput.value = '';
      modalError.textContent = '';
      modalOverlay.classList.add('active');
      setTimeout(() => modalInput.focus(), 150);
    }

    function openEditModal(menuKey, index) {
      currentMenu = menuKey;
      editIndex = index;
      const label = menuKey === 'daily' ? '日常' : '改善伙食';
      modalTitle.textContent = `编辑食物 — ${label}`;
      modalInput.value = foods[menuKey][index];
      modalError.textContent = '';
      modalOverlay.classList.add('active');
      setTimeout(() => { modalInput.focus(); modalInput.select(); }, 150);
    }

    function closeModal() {
      modalOverlay.classList.remove('active');
      modalInput.value = '';
      editIndex = -1;
    }

    function confirmModal() {
      const name = modalInput.value.trim();
      if (!name) {
        modalError.textContent = '名称不能为空';
        modalInput.focus();
        return;
      }

      if (editIndex === -1) {
        foods[currentMenu].push(name);
        showToast(`已添加「${name}」`);
      } else {
        const oldName = foods[currentMenu][editIndex];
        foods[currentMenu][editIndex] = name;
        showToast(`已更新「${oldName}」→「${name}」`);
      }

      persistMenu(currentMenu);
      renderList(currentMenu);
      closeModal();
    }

    // ===== Delete =====
    function openDeleteModal(menuKey, index) {
      currentMenu = menuKey;
      deleteIndex = index;
      deleteMsg.textContent = `确定删除「${foods[menuKey][index]}」？`;
      deleteOverlay.classList.add('active');
    }

    function closeDeleteModal() {
      deleteOverlay.classList.remove('active');
      deleteIndex = -1;
    }

    function confirmDelete() {
      if (deleteIndex === -1) return;
      const name = foods[currentMenu][deleteIndex];
      foods[currentMenu].splice(deleteIndex, 1);
      persistMenu(currentMenu);
      renderList(currentMenu);
      closeDeleteModal();
      showToast(`已删除「${name}」`);

      // Reset lottery display after deletion
      resetLottery(currentMenu);
    }

    // ===== Modal Event Listeners =====
    btnAddDaily.addEventListener('click', () => openAddModal('daily'));
    btnAddPremium.addEventListener('click', () => openAddModal('premium'));

    btnCancel.addEventListener('click', closeModal);
    btnConfirm.addEventListener('click', confirmModal);

    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) closeModal();
    });

    modalInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') confirmModal();
      if (e.key === 'Escape') closeModal();
    });

    // Delete modal listeners
    btnDeleteCancel.addEventListener('click', closeDeleteModal);
    btnDeleteConfirm.addEventListener('click', confirmDelete);
    deleteOverlay.addEventListener('click', (e) => {
      if (e.target === deleteOverlay) closeDeleteModal();
    });

    // List item click delegation for edit/delete icons — both panels
    foodListDaily.addEventListener('click', (e) => handleListClick('daily', e));
    foodListPremium.addEventListener('click', (e) => handleListClick('premium', e));

    function handleListClick(menuKey, e) {
      const editBtn = e.target.closest('[data-edit]');
      const deleteBtn = e.target.closest('[data-delete]');

      if (editBtn) {
        const index = parseInt(editBtn.dataset.edit, 10);
        if (!isNaN(index) && index >= 0 && index < foods[menuKey].length) {
          openEditModal(menuKey, index);
        }
      }

      if (deleteBtn) {
        const index = parseInt(deleteBtn.dataset.delete, 10);
        if (!isNaN(index) && index >= 0 && index < foods[menuKey].length) {
          openDeleteModal(menuKey, index);
        }
      }
    }

    // ===== Lottery =====
    function resetLottery(menuKey) {
      const refs = domRefs[menuKey];
      refs.lotteryResult.textContent = '';
      refs.lotteryResult.classList.remove('bounce');
      refs.lotteryBox.classList.remove('result');
      refs.btnLottery.textContent = '🎲 开抽！';
      if (foods[menuKey].length > 0) refs.btnLottery.disabled = false;
    }

    function isRolling(menuKey) {
      return menuKey === 'daily' ? isRollingDaily : isRollingPremium;
    }

    function setRolling(menuKey, val) {
      if (menuKey === 'daily') isRollingDaily = val;
      else isRollingPremium = val;
    }

    function startLottery(menuKey) {
      const refs = domRefs[menuKey];
      const list = foods[menuKey];
      const count = list.length;
      if (count === 0 || isRolling(menuKey)) return;

      setRolling(menuKey, true);
      refs.btnLottery.disabled = true;
      refs.lotteryResult.classList.remove('bounce');
      refs.lotteryBox.classList.add('rolling');
      refs.lotteryBox.classList.remove('result');

      const winnerIndex = Math.floor(Math.random() * count);
      const winner = list[winnerIndex];

      const fastSteps = 18;
      const slowSteps = 6;
      const sequence = [];

      for (let i = 0; i < fastSteps; i++) {
        sequence.push({ name: list[Math.floor(Math.random() * count)], delay: 80 });
      }

      for (let i = 0; i < slowSteps; i++) {
        const progress = i / slowSteps;
        const delay = 80 + (300 - 80) * progress;
        const name = i === slowSteps - 1 ? winner : list[Math.floor(Math.random() * count)];
        sequence.push({ name, delay: Math.round(delay) });
      }

      let step = 0;
      function nextStep() {
        if (step >= sequence.length) {
          finishLottery(menuKey, winner);
          return;
        }
        refs.lotteryResult.textContent = sequence[step].name;
        step++;
        setTimeout(nextStep, sequence[step - 1].delay);
      }
      nextStep();
    }

    function finishLottery(menuKey, winner) {
      const refs = domRefs[menuKey];
      refs.lotteryBox.classList.remove('rolling');
      refs.lotteryBox.classList.add('result');
      refs.lotteryResult.textContent = winner;
      refs.lotteryResult.classList.add('bounce');
      refs.btnLottery.textContent = '🔄 再来一次';
      refs.btnLottery.disabled = false;
      setRolling(menuKey, false);
      spawnConfetti(refs.lotteryBox);
    }

    // ===== Confetti =====
    function spawnConfetti(box) {
      const emojis = ['🎉', '✨', '🍜', '🍛', '🥟', '🍔', '🍕', '🥡'];
      const boxRect = box.getBoundingClientRect();

      for (let i = 0; i < 8; i++) {
        const el = document.createElement('span');
        el.className = 'confetti';
        el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        el.style.left = (boxRect.left + Math.random() * boxRect.width) + 'px';
        el.style.top  = (boxRect.top + boxRect.height / 2 + Math.random() * 30) + 'px';
        el.style.animationDelay = (Math.random() * 0.3) + 's';
        el.style.fontSize = (20 + Math.random() * 16) + 'px';
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 1500);
      }
    }

    btnLotteryDaily.addEventListener('click', () => handleLotteryClick('daily'));
    btnLotteryPremium.addEventListener('click', () => handleLotteryClick('premium'));

    function handleLotteryClick(menuKey) {
      const refs = domRefs[menuKey];
      const list = foods[menuKey];
      if (list.length === 0) return;
      if (list.length === 1) {
        refs.lotteryBox.classList.add('result');
        refs.lotteryResult.textContent = list[0];
        refs.lotteryResult.classList.add('bounce');
        refs.btnLottery.textContent = '🔄 就这一个，别犹豫了！';
        return;
      }
      startLottery(menuKey);
    }
    // ===== Toast =====
    let toastTimer = null;

    function showToast(msg) {
      if (toastTimer) clearTimeout(toastTimer);
      toast.textContent = msg;
      toast.classList.add('show');
      toastTimer = setTimeout(() => {
        toast.classList.remove('show');
        toastTimer = null;
      }, 2000);
    }

    // ===== Keyboard Shortcut =====
    document.addEventListener('keydown', (e) => {
      if (modalOverlay.classList.contains('active')) return;
      if (deleteOverlay.classList.contains('active')) return;
      if (settingsOverlay.classList.contains('active')) return;

      // Space or Enter triggers daily lottery (primary)
      if (e.key === ' ' || e.key === 'Enter') {
        e.preventDefault();
        handleLotteryClick('daily');
      }
    });

    // ===== Settings =====
    const settingsOverlay    = document.getElementById('settingsOverlay');
    const settingsTokenInput = document.getElementById('settingsToken');
    const settingsError      = document.getElementById('settingsError');
    const btnSettings        = document.getElementById('btnSettings');
    const btnSettingsCancel  = document.getElementById('btnSettingsCancel');
    const btnSettingsSave    = document.getElementById('btnSettingsSave');
    const btnClearToken      = document.getElementById('btnClearToken');
    const syncStatusEl       = document.getElementById('syncStatus');

    function updateSyncUI(state) {
      if (state === 'on') {
        syncStatusEl.innerHTML = '<span class="sync-dot on"></span>已启用同步';
      } else if (state === 'loading') {
        syncStatusEl.innerHTML = '<span class="sync-dot loading"></span>同步中...';
      } else {
        syncStatusEl.innerHTML = '<span class="sync-dot off"></span>未启用同步';
      }
    }

    function openSettings() {
      const token = getToken();
      settingsTokenInput.value = token;
      btnClearToken.style.display = token ? '' : 'none';
      settingsError.textContent = '';
      updateSyncUI(syncEnabled ? 'on' : 'off');
      settingsOverlay.classList.add('active');
    }

    function closeSettings() {
      settingsOverlay.classList.remove('active');
    }

    async function saveSettings() {
      const token = settingsTokenInput.value.trim();
      if (!token) {
        settingsError.textContent = '请输入 GitHub Token';
        return;
      }

      // Validate token by making a test request
      settingsError.textContent = '';
      updateSyncUI('loading');
      setToken(token);
      syncEnabled = true;

      const remoteData = await fetchRemoteData();
      if (remoteData === null && remoteSha === null) {
        // Could be 404 (no data.json yet) or network error — try pushing current data
        // For 404, our push will create the file
        try {
          const testResp = await fetch(REPO_API, {
            headers: { Authorization: `Bearer ${getToken()}`, Accept: 'application/vnd.github.v3+json' },
            cache: 'no-store'
          });
          if (testResp.status !== 404 && !testResp.ok) {
            settingsError.textContent = 'Token 无效或无权限访问此仓库';
            setToken(''); // clear invalid token
            syncEnabled = false;
            updateSyncUI('off');
            return;
          }
          // 404 is fine — means no data.json yet, will create on first save
          remoteSha = null;
        } catch (e) {
          // Network error, but token format looks ok — proceed
        }
      }

      if (remoteData) {
        foods.daily = remoteData.daily;
        foods.premium = remoteData.premium;
        saveFoods(STORAGE_KEY_DAILY, foods.daily);
        saveFoods(STORAGE_KEY_PREMIUM, foods.premium);
        renderList('daily');
        renderList('premium');
        showToast('已从云端同步数据 ✅');
      } else {
        // Push local data to remote (first sync)
        await pushRemoteData();
        showToast('同步已启用 ✅');
      }

      updateSyncUI('on');
      btnClearToken.style.display = '';
      settingsError.textContent = '';
      closeSettings();
    }

    function clearSyncSettings() {
      clearToken();
      syncEnabled = false;
      remoteSha = null;
      settingsTokenInput.value = '';
      btnClearToken.style.display = 'none';
      updateSyncUI('off');
      showToast('已清除 Token，同步已关闭');
    }

    btnSettings.addEventListener('click', openSettings);
    btnSettingsCancel.addEventListener('click', closeSettings);
    btnSettingsSave.addEventListener('click', saveSettings);
    btnClearToken.addEventListener('click', clearSyncSettings);

    settingsOverlay.addEventListener('click', (e) => {
      if (e.target === settingsOverlay) closeSettings();
    });

    settingsTokenInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') saveSettings();
      if (e.key === 'Escape') closeSettings();
    });
  </script>
</body>
</html>
