<h2>两个餐谱区域如何从视觉上区分？</h2>
<p class="subtitle">需要让用户一眼就能分辨「日常」和「改善」</p>

<div class="options">
  <div class="option" data-choice="a" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>不同颜色主题</h3>
      <p>日常保持橙红色调（现有风格），改善用金色/紫色调。通过抽奖框边框、按钮颜色区分</p>
    </div>
  </div>
  <div class="option" data-choice="b" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>相同风格 + 标题区分</h3>
      <p>两个区域使用相同的颜色风格，仅通过标题文字和图标区分（🍚 日常 | 🥘 改善）</p>
    </div>
  </div>
</div>
