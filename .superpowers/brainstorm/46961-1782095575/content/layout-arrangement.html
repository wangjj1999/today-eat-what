<h2>两个抽奖区如何排列？</h2>
<p class="subtitle">页面上同时展示「日常」和「改善」两份餐谱</p>

<div class="options">
  <div class="option" data-choice="a" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>左右并排（桌面端）/ 上下堆叠（手机端）</h3>
      <p>大屏幕上两个区域并排，手机上自动变成上下排列。空间利用率高，适合对比</p>
    </div>
  </div>
  <div class="option" data-choice="b" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>始终上下堆叠</h3>
      <p>不管屏幕大小，日常在上、改善在下。简单直接，滚动即可查看</p>
    </div>
  </div>
</div>
