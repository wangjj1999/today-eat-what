<h2>两份餐谱之间如何切换？</h2>
<p class="subtitle">你需要一个机制在日常餐谱和改善伙食之间切换</p>

<div class="options">
  <div class="option" data-choice="a" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>Tab 标签切换</h3>
      <p>顶部两个标签页：「🍚 日常」「🥘 改善」，点击切换显示对应的食物清单和抽奖区</p>
    </div>
  </div>
  <div class="option" data-choice="b" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>下拉选择器</h3>
      <p>抽奖按钮旁边有一个下拉菜单，先选餐谱再点抽奖，食物清单也跟随切换</p>
    </div>
  </div>
  <div class="option" data-choice="c" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>两个独立抽奖区</h3>
      <p>页面上同时展示两个抽奖区域（上下或左右排列），各有各的按钮和清单</p>
    </div>
  </div>
</div>
